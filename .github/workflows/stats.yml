name: GitHub Metrics
on:
  # Schedule updates once a day
  schedule: [{cron: "0 0 * * *"}]
  # Lines below let you run it manually from the Actions tab anytime
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: musowir
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: GMT
          theme: highcontrast
