name: GitHub Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: musowir
          template: classic
          # Crucial changes below to hide the fluff and keep it clean:
          base: header, activity, community, repositories
          base_skip: yes                         # This hides the giant list of numbers
          plugin_languages: yes                  # This adds a beautiful language breakdown grid
          plugin_languages_ignored: html, css    # Hides non-programming languages
          plugin_languages_details: bytes-size, percentage
          config_timezone: GMT
